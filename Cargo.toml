[package]
name = "runen-graph"
version = "0.0.0"
edition = "2024"
license.workspace = true
repository = "https://github.com/dornglut/runen-graph"
description = "Standalone reusable graph and relationship framework over caller-owned identities"
publish = false

[lib]
name = "runen_graph"

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
